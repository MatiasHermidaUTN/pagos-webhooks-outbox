spring.application.name=pagos-webhooks-outbox

# PostgreSQL por defecto; se pisa con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pagos}
spring.datasource.username=${DB_USER:pagos}
spring.datasource.password=${DB_PASSWORD:pagos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.flyway.enabled=true
